name: Surveillance créneaux NORDERM

on:
  schedule:
    # Toutes les 20 min, 6h-8h UTC+2, du lundi (1) au vendredi (5)
    # ⚠️ À décaler d'1h (6h-17h UTC) lors du passage à l'heure d'hiver (CET, UTC+1)
  - cron: '*/20 4-5 * * 1-5'
  - cron: '0 6 * * 1-5'
  workflow_dispatch:  # permet de le lancer manuellement depuis GitHub, pour tester

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Lancer la vérification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_creneaux.py

      - name: Sauvegarder la capture d'écran (si erreur)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-erreur
          path: error.png
          if-no-files-found: ignore
          retention-days: 5
